{% extends "base.html" %}

{% block title %}{{ _('Add Category') }} - {{ app_setting.app_name }}{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="page-header-card">

        <div class="page-header-row">

            <div class="page-header-left">

                <div class="page-header-icon">
                    <i class="bi bi-plus-circle"></i>
                </div>

                <div>
                    <h4 class="page-header-title">
                        {{ _('Add Category') }}
                    </h4>
                </div>

            </div>

            <div class="page-header-actions">

                <a href="{{ url_for('main.categories') }}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i>
                    {{ _('Back') }}
                </a>

            </div>

        </div>

    </div>

    <div class="card">

        <div class="card-body">

            <form method="POST">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">

                    <label class="form-label">
                        {{ _('Category Name') }}
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        placeholder="{{ _('Example: Laptop') }}"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        {{ _('Description') }}
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        rows="4"
                        placeholder="{{ _('Category description...') }}"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    {{ _('Save') }}
                </button>

                <a
                    href="{{ url_for('main.categories') }}"
                    class="btn btn-secondary"
                >
                    {{ _('Cancel') }}
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
